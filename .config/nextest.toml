# cargo-nextest configuration. See https://nexte.st/docs/configuration/
#
# The slowest test in the workspace takes about 10 s in a debug build (the doc
# example corpus). A test that takes more than twelve times that is not slow,
# it is stuck — most likely waiting on the one JavaScript thread that every
# evaluation and every script callback goes through — and without a limit a
# stuck test holds CI until the runner's own six-hour timeout.

[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
slow-timeout = { period = "30s", terminate-after = 4 }
# Report every failure in one run rather than stopping at the first.
fail-fast = false
