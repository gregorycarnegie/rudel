name: CI

# Guards the parity surface: the workspace test suite includes the generated
# parity drift guards (crates/rudel-lang reference_parity / api_inventory /
# reference_snapshot, plus the rudel-mini mini/tonal goldens), so a change that
# silently alters Rudel's exposed names or its hap-for-hap behavior fails here.
# These tests embed committed JSON/text goldens, so they need no vendored
# `strudel/` checkout. Mirrors the check commands documented in the README.

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # System libraries for the GUI (`eframe`/egui) and audio (`cpal`/ALSA)
      # crates so the whole workspace builds on Linux.
      #
      # The build *tools* at the end are for the recorder's codec libraries
      # that are still compiled from vendored C: LAME's crate drives autotools.
      # They are on the hosted runner image already; they are named here so a
      # change to that image fails at this step with a clear message rather
      # than deep inside a build script.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev \
            libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgtk-3-dev \
            autoconf automake libtool

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # nextest runs every test in its own process. The engine keeps real
      # globals — `set_string_parser`, the soundfont statics, the scope
      # registry — so a test that only passes because a neighbour set one up
      # fails here instead of hiding behind a shared process. The workspace has
      # no doctests, so nextest not running them costs nothing.
      - name: Test
        run: cargo nextest run --workspace --profile ci

  # The workspace publishes `rust-version = "1.96"`; without this nothing
  # checks it, and a dependency bump or a newly stabilised API can raise the
  # real floor without anyone noticing. `check` rather than `test`: the promise
  # is that the library compiles on 1.96, not that the dev-dependencies do.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev \
            libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgtk-3-dev \
            autoconf automake libtool

      - name: Read the workspace rust-version
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | tr -d ' "' | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "workspace MSRV is $version"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace
