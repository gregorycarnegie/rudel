name: Release

# Cuts binaries for a pushed `v*` tag (`git tag v0.16.0 && git push --tags`),
# or on demand from the Actions tab. The CI workflow already covers clippy and
# the test suite; this one only builds and uploads.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write


jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      # Same GUI/audio libraries and codec build tools the CI workflow installs.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev \
            libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgtk-3-dev \
            libclang-dev \
            autoconf automake libtool

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/ffmpeg

      - name: Build
        run: cargo build --release --locked -p rudel-app --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="rudel-${{ github.ref_name }}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/rudel"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          mkdir -p "dist/$name"
          cp "$bin" README.md LICENSE "dist/$name/"
          mkdir -p "dist/$name/licenses"
          cp crates/rudel-ffmpeg/LICENSE.* crates/rudel-ffmpeg/NOTICE.md "dist/$name/licenses/"
          for copyright in target/ffmpeg/*/share/*/copyright; do
            port=$(basename "$(dirname "$copyright")")
            cp "$copyright" "dist/$name/licenses/$port.txt"
          done
          cp target/ffmpeg-sources.tar.gz "dist/$name-native-sources.tar.gz"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.${{ matrix.archive }}
            dist/*-native-sources.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
