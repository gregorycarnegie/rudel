name: Release

# Cuts binaries for a pushed `v*` tag (`git tag v0.16.0 && git push --tags`),
# or on demand from the Actions tab. The CI workflow already covers clippy and
# the test suite; this one only builds and uploads.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write


jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      # Same GUI/audio libraries and codec build tools the CI workflow installs.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev \
            libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgtk-3-dev \
            libclang-dev \
            autoconf automake libtool

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p rudel-app --target ${{ matrix.target }}

      # hydra's `initVideo` runs ffmpeg; a static build ships next to `rudel`,
      # where ffmpeg-sidecar looks first, so nobody has to install it. A
      # separate program, not linked in: its licence and source go alongside.
      - name: Fetch FFmpeg
        shell: bash
        run: |
          mkdir -p ffmpeg && cd ffmpeg
          btbn=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
          case "${{ runner.os }}" in
            Windows)
              curl -fsSL -o f.zip "$btbn/ffmpeg-master-latest-win64-lgpl.zip"
              dir=ffmpeg-master-latest-win64-lgpl
              7z e -y f.zip "$dir/bin/ffmpeg.exe" "$dir/LICENSE.txt" >/dev/null
              src="https://github.com/BtbN/FFmpeg-Builds" ;;
            Linux)
              curl -fsSL "$btbn/ffmpeg-master-latest-linux64-lgpl.tar.xz" \
                | tar xJ --strip-components=1 --wildcards '*/bin/ffmpeg' '*/LICENSE.txt'
              mv bin/ffmpeg . && rmdir bin
              src="https://github.com/BtbN/FFmpeg-Builds" ;;
            macOS)
              curl -fsSL -o f.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip"
              unzip -o f.zip ffmpeg
              curl -fsSL -o LICENSE.txt https://www.gnu.org/licenses/gpl-3.0.txt
              src="https://ffmpeg.martin-riedl.de" ;;
          esac
          rm -f f.zip
          chmod +x ffmpeg* || true
          ./ffmpeg -hide_banner -version | head -1
          mv LICENSE.txt FFMPEG-LICENSE.txt
          printf 'ffmpeg here is FFmpeg (https://ffmpeg.org), unmodified, as built by\n%s.\nIts licence is in FFMPEG-LICENSE.txt; its source is at https://ffmpeg.org/download.html\nand the build scripts at the address above.\n' "$src" > FFMPEG-NOTICE.txt

      - name: Package
        shell: bash
        run: |
          name="rudel-${{ github.ref_name }}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/rudel"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          mkdir -p "dist/$name"
          cp "$bin" README.md LICENSE ffmpeg/* "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
