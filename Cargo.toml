# Rudel — a Rust fork of Strudel (https://codeberg.org/uzu/strudel)
# Licensed under the GNU Affero General Public License v3.0 or later, as is Strudel.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.22.1"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/gregorycarnegie/rudel"
rust-version = "1.99"

[workspace.dependencies]
# Path only, deliberately. A `version` here would not be the one the members
# inherit from `[workspace.package]` above — it is the *requirement* a published
# crate carries for its siblings, which `cargo package` demands because it
# strips the `path`. Rudel ships binaries, not crates: it is not on crates.io
# and has no plans to be, so that requirement would be seven more literals to
# bump on every release in exchange for a command nobody runs. `cargo package
# --workspace` therefore does not succeed here, and is not meant to.
rudel-core = { path = "crates/rudel-core" }
rudel-dsp = { path = "crates/rudel-dsp" }
rudel-lang = { path = "crates/rudel-lang" }
rudel-midi = { path = "crates/rudel-midi" }
rudel-mini = { path = "crates/rudel-mini" }
rudel-osc = { path = "crates/rudel-osc" }
rudel-audio = { path = "crates/rudel-audio" }
wide = "1.7.1"
indexmap = "2.14.2"
num-rational = "0.4.2"
num-integer = "0.1.47"
num-traits = "0.2.19"
phf = { version = "0.14.0", features = ["macros"] }
proptest = "1.11.0"
stacker = "0.1.25"
# wgpu's own shader front-end, already in the tree through it. Two crates parse
# WGSL with it — `rudel-app` validates a widget's shader before wgpu can abort
# the process over it, `rudel-lang` checks the hydra port's output in tests — so
# the version lives here to keep them from drifting apart.
naga = { version = "30.0.1", features = ["wgsl-in"] }
# `float_roundtrip`: serde_json's default float parser can land one ulp off the
# correctly-rounded value, which is enough to flip a golden comparison against
# JS-produced numbers (it did, on the bytebeat oracle).
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

# Release codegen plus line tables, so a sampling profiler resolves frames to
# source. Separate from `release` so normal builds stay small.
#
#   cargo build --profile profiling -p rudel-app
#   samply record ./target/profiling/rudel.exe
[profile.profiling]
inherits = "release"
debug = 1

# Optimise dependencies (not the workspace crates) in dev and test builds. Most
# test time is boa running scripts; this halves the suite (30s -> 17s) for a
# one-off dependency rebuild that rust-cache keeps in CI. The workspace crates
# stay unoptimised, so they still debug and rebuild quickly.
#
# No `[profile.release]` tuning, on measurement: fat LTO + codegen-units = 1
# tripled the release build and moved the pattern and mixer benches by less
# than their run-to-run noise. `panic = "abort"` is out regardless — eval
# relies on `catch_unwind` to turn an engine panic into a script error.
[profile.dev.package."*"]
opt-level = 2
