[package]
name = "rudel-app"
description = "Native live-coding editor for Rudel (egui + audio)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rudel"
path = "src/main.rs"

[dependencies]
rudel-core = { path = "../rudel-core" }
rudel-lang = { path = "../rudel-lang" }
rudel-audio = { path = "../rudel-audio" }
rudel-midi = { path = "../rudel-midi" }
rudel-osc = { path = "../rudel-osc" }
eframe = "0.36.1"
# egui exposes `copy_text` but no clipboard *read*, so the context menu's Paste
# has to go to the platform itself. Already in the tree via egui-winit.
arboard = "3.6.1"

# SAPI, for `.speak(...)`. Already in the tree via cpal, so this asks the same
# crate for two more of its feature-gated modules rather than adding one.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Globalization",
    "Win32_Media_Speech",
    "Win32_System_Com",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
egui_kittest = { version = "0.36.1", features = ["eframe"] }
