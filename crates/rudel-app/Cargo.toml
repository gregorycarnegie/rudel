[package]
name = "rudel-app"
description = "Native live-coding editor for Rudel (egui + audio)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rudel"
path = "src/main.rs"

[dependencies]
rudel-core.workspace = true
rudel-lang.workspace = true
rudel-audio.workspace = true
rudel-midi.workspace = true
rudel-osc.workspace = true
# `persistence`: eframe autosaves every 30s and on exit, which is what keeps
# the editor buffer across a crash or a close. No file dialogs, no autosave
# thread of our own.
eframe = { version = "0.36.2", features = ["persistence"] }
# Native Open/Save dialogs; egui has no file picker of its own.
rfd = "0.17.2"
# Parses and validates a widget's WGSL *before* handing it to wgpu, whose
# default handler aborts the process on a validation error — a typo mid-set
# must not be fatal.
naga.workspace = true
# hydra's `s0.initImage(url)`. Already in the graph through eframe; this only
# adds JPEG, which most shared patterns point at.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# hydra's `s0.initCam()`: webcam capture through the platform's own API
# (Media Foundation on Windows). Frames are decoded here, not by nokhwa's
# `decoding` feature, which would build a C JPEG library.
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native"] }
# hydra's `s0.initVideo(url)`: MP4 demuxing, and H.264 decoding by Cisco's
# OpenH264, built from its bundled source (no system library).
mp4 = "0.14.0"
openh264 = "0.9.8"
# Strudel's draw canvas (`getDrawContext`, `.draw`, `animate`): a persistent
# raster like a browser canvas, and its text in egui's own default font.
tiny-skia = "0.12.0"
ab_glyph = "0.2.32"
epaint_default_fonts = "0.36.2"
# Editor themes are TOML files (themes/, and the user's own themes folder).
# Already in the tree through the Windows resource build step.
toml = "1.1.6"
# `@strudel/gamepad`: controllers through each platform's own API (Windows.Gaming.Input,
# IOKit, evdev via libudev).
gilrs = "0.11.2"
# `@strudel/serial`: `.serial()` writes to a serial port (libudev on Linux, as
# gilrs).
serialport = "4.10.1"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

# SAPI, for `.speak(...)`. Already in the tree via cpal, so this asks the same
# crate for two more of its feature-gated modules rather than adding one.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Globalization",
    "Win32_Media_Speech",
    "Win32_System_Com",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu"] }
tempfile = "3.27.0"

# hydra's `s0.initScreen()`: screen capture. Not on Linux, where xcap needs
# PipeWire, GBM and DRM development libraries to build; `initScreen` reads as
# empty there.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
xcap = { version = "0.9.8", default-features = false }
