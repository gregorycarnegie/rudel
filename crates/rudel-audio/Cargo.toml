[package]
name = "rudel-audio"
description = "Real-time clock, scheduler and cpal output for Rudel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rudel-core.workspace = true
rudel-dsp.workspace = true
cpal = "0.18.2"
# Sample decoding. `all` is the codec set fundsp pulled in when it owned this,
# and is not optional: MP3 is behind a feature flag and off by default. Gapless
# playback is why the decode is ours at all (see samples/decoding.rs).
symphonia = { version = "0.6.1", features = ["all"] }
# Csound is opened at runtime, never linked: see src/csound.rs.
libloading = "0.9.0"
# Already in the graph via ureq; a decoder is not worth hand-rolling.
base64 = "0.23.1"
serde_json.workspace = true
ureq = "3.4.0"
mp3lame-encoder = "0.2.5"
vorbis_rs = "0.5.6"
opus = "0.3.1"
ogg = "0.9.2"
flacenc = { version = "0.5.1", default-features = false }

[dev-dependencies]
rudel-mini.workspace = true
rudel-lang.workspace = true
tempfile = "3.27.0"

[[bench]]
name = "render"
harness = false
