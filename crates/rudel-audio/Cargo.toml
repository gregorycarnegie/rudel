[package]
name = "rudel-audio"
description = "Real-time clock, scheduler and cpal output for Rudel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rudel-core = { path = "../rudel-core" }
rudel-dsp = { path = "../rudel-dsp" }
cpal = "0.18.1"
# Sample decoding. `all` is the codec set fundsp pulled in when it owned this,
# and is not optional: MP3 is behind a feature flag and off by default. Gapless
# playback is why the decode is ours at all (see samples/decoding.rs).
symphonia = { version = "0.6.0", features = ["all"] }
# Csound is opened at runtime, never linked: see src/csound.rs.
libloading = "0.9.0"
serde_json.workspace = true
ureq = "3.4.0"

[dev-dependencies]
rudel-mini = { path = "../rudel-mini" }
rudel-lang = { path = "../rudel-lang" }
tempfile = "3.27.0"

[[bench]]
name = "render"
harness = false
