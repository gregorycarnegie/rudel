[package]
name = "rudel-lang"
description = "JavaScript scripting bindings for live-coding Rudel patterns"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rudel-core.workspace = true
rudel-mini.workspace = true
# No default features: they are `Temporal` and friends, which pull in ICU
# calendar and time-zone data no pattern reaches for.
boa_engine = { version = "0.22.0", default-features = false }
# Named by the `Trace`/`Finalize` derives, which expand to `::boa_gc::` paths.
boa_gc = "0.22.0"
serde_json.workspace = true

[dev-dependencies]
proptest.workspace = true
rstest.workspace = true
# Validates the WGSL the hydra port generates, so a mistranslated body fails a
# test rather than a GPU.
naga.workspace = true
# Runs the compiled kabelsalat graphs in `kabelsalat_parity`. Test-only, and the
# dependency points one way — rudel-dsp never reaches back for rudel-lang.
rudel-dsp.workspace = true

[[bench]]
name = "patterns"
harness = false
